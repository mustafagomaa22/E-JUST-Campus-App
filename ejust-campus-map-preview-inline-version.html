<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-JUST Campus Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E;
  --red-dark:#9F0C24;
  --red-tint:#FBE7EA;
  --gold:#C89A44;
  --gold-tint:#F6EDDB;
  --ink:#1B1D1F;
  --ink-soft:#6B7076;
  --slate:#8A9099;
  --line:#E6E8EA;
  --bg:#F6F7F8;
  --white:#FFFFFF;
  --green:#1E8A4C;
  --surface-dark:#1B1D1F;
  --green-tint:#E3F3E9;
  --radius:16px;
  --shadow:0 10px 24px -12px rgba(27,29,31,0.16);
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}

/* ===== CURSOR: pointer on every interactive element ===== */
button, .btn, select,
[data-nav], [data-action], [data-searchresult], [data-recent-term], [data-visitor-link],
[data-pin], [data-pin-select], [data-layer], [data-restab], [data-savedtab], [data-roomfilter],
[data-toggle-floor], [data-faq], [data-setting], [data-mode], [data-zoomctl], [data-crumb],
.acc-head, .faq-q, .switch, .avatar, .fchip, .tabbar button, .mode-tabs button,
.qcard, .pop-card, .res-row, .doc-row, .more-row, .saved-row, .room-tile, .sidebar-item,
.icon-btn, .bookmark-btn, .swap-btn, .mc-btn, .recent-chip button, .layer-item, .map-pin,
label.layer-item{
  cursor:pointer;
}
input[type="text"], input[type="email"], textarea{ cursor:text; }
input:disabled, button:disabled{ cursor:not-allowed; }
html,body{margin:0; padding:0;}
body{
  background:#DEE1E3; font-family:var(--font-body); color:var(--ink); -webkit-font-smoothing:antialiased;
  min-height:100vh; transition:background .2s;
}
body.dark{
  --ink:#F1F2F3; --ink-soft:#9AA0A6; --line:#2C2F33; --bg:#141618; --white:#1D2023; --red-tint:#3A1A1F; --gold-tint:#332A16;
  background:#0C0D0E;
}
body.dark .qcard, body.dark .card, body.dark .topbar, body.dark .bottombar, body.dark .searchbar,
body.dark .fchip, body.dark .recent-chip, body.dark .pop-card, body.dark .fromto, body.dark .stat-box,
body.dark .mode-tabs button, body.dark .tabbar button, body.dark .room-tile, body.dark .fp-cell,
body.dark .field select, body.dark .field input, body.dark .icon-btn, body.dark .bookmark-btn, body.dark .mc-btn, body.dark .my-loc, body.dark .sheet{
  background:var(--white); border-color:var(--line); color:var(--ink);
}
body.dark .map-canvas{background:var(--bg);}
[dir="rtl"] .back-link svg, [dir="rtl"] .chev{ transform:scaleX(-1); }
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
a{color:inherit; text-decoration:none;}
.mono{font-family:var(--font-mono);}
::selection{background:var(--red); color:#fff;}
:focus-visible{outline:2px solid var(--red); outline-offset:2px;}
.hidden{display:none !important;}

/* ===== LOGIN SCREEN ===== */
#screen-login{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(circle at 30% 20%, #2A1013 0%, #0C0D0E 55%);
}
.login-card{ width:100%; max-width:400px; background:var(--white,#fff); border-radius:22px; padding:30px 26px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); animation:fadeSlideIn .4s ease; }
.login-logo{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
.login-logo b{ font-family:var(--font-display); font-size:17px; display:block; }
.login-logo span{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
.login-card h1{ font-size:23px; margin-bottom:6px; }
.login-sub{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:20px; }
.login-tabs{ display:flex; gap:6px; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:20px; }
.login-tabs button{ flex:1; background:none; border:none; border-radius:9px; padding:9px; font-size:13px; font-weight:600; color:var(--ink-soft); transition:background .18s ease, color .18s ease; }
.login-tabs button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 6px rgba(0,0,0,.08); }
.login-note{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:12px; }
#login-guest-form{ animation:fadeSlideIn .25s ease; }
#login-student-form{ animation:fadeSlideIn .25s ease; }


#app-shell{
  max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg);
  box-shadow:var(--shadow); position:relative; display:none; flex-direction:column;
}
#app-shell.active{ display:flex; }
@media(min-width:520px){ body{padding:24px 0;} #app-shell{border-radius:28px; overflow:hidden; min-height:calc(100vh - 48px);} }

/* ===== TOP BAR ===== */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--white); border-bottom:1px solid var(--line);
  padding:12px 14px; display:flex; align-items:center; gap:10px;
}
.logo-mark{width:30px; height:30px; border-radius:9px; background:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.logo-text{line-height:1.15;}
.logo-text b{font-family:var(--font-display); font-size:14px; display:block;}
.logo-text span{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
.topnav{display:flex; gap:2px; margin-left:auto; flex-shrink:0;}
.topnav button{background:none; border:none; font-size:10.5px; color:var(--ink-soft); font-weight:600; padding:6px 7px; border-radius:7px;}
.topnav button.on{color:var(--red); background:var(--red-tint);}
.avatar{
  width:28px; height:28px; border-radius:50%; background:var(--surface-dark); color:#fff; display:flex; align-items:center;
  justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; font-family:var(--font-display); margin-left:4px;
}

/* ===== BOTTOM TAB BAR ===== */
.bottombar{
  position:sticky; bottom:0; z-index:40; background:var(--white); border-top:1px solid var(--line);
  display:flex; padding:6px 4px 10px;
}
.bottombar button{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-soft); font-size:10.5px; font-weight:600; padding:6px 2px; border-radius:10px;
}
.bottombar button svg{width:20px; height:20px;}
.bottombar button.on{color:var(--red);}

/* ===== CONTENT ===== */
#content{flex:1; padding:16px 14px 24px;}
.back-link{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:12px;}
.back-link svg{width:15px; height:15px;}
.back-link:hover{color:var(--ink);}

/* ===== CARDS / GENERIC ===== */
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
.card + .card{margin-top:12px;}
.section-title{font-size:14px; font-weight:700; margin-bottom:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:11px; font-weight:600; font-size:13px; padding:11px 16px;}
.btn-block{width:100%;}
.btn-primary{background:var(--red); color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-dark{background:var(--surface-dark); color:#fff;}
.btn-dark:hover{background:#000;}
.btn-ghost{background:var(--white); color:var(--ink); border:1.4px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{padding:8px 12px; font-size:12px;}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1.4px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.icon-btn.on{background:var(--red-tint); border-color:var(--red);}

/* ===== HOME ===== */
.hero h1{font-size:24px; line-height:1.15; margin-bottom:6px;}
.hero p{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;}
.searchbar{
  display:flex; align-items:center; gap:8px; background:#fff; border:1.4px solid var(--line); border-radius:13px;
  padding:11px 12px; margin-bottom:18px;
}
.searchbar input{border:none; outline:none; flex:1; font-size:13.5px; font-family:var(--font-body); background:transparent;}
.searchbar svg{flex-shrink:0; color:var(--ink-soft);}
.searchbar button{background:var(--red); color:#fff; border:none; border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

.qgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px;}
.qcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:left;}
.qcard .qi{width:34px; height:34px; border-radius:10px; background:var(--red-tint); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
.qcard .qi svg{width:17px; height:17px; color:var(--red);}
.qcard b{font-size:12.5px; display:block;}
.qcard span{font-size:10.5px; color:var(--ink-soft);}

.guide-card{background:var(--surface-dark); border-radius:16px; padding:18px; color:#fff; position:relative; overflow:hidden;}
.guide-card h4{font-size:15px; margin-bottom:6px;}
.guide-card p{font-size:12px; color:rgba(255,255,255,0.65); margin-bottom:14px; max-width:200px;}

/* ===== SEARCH PAGE ===== */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px;}
.chip-row::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0; padding:8px 14px; border-radius:999px; border:1.4px solid var(--line); background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.fchip.on{background:var(--surface-dark); color:#fff; border-color:var(--surface-dark);}

.recent-chip{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 12px; font-size:12px; margin:0 8px 8px 0;}
.recent-chip button{background:var(--bg); border:none; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft);}

.pop-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; align-items:center; gap:10px;}
.pop-card .qi{width:32px; height:32px; border-radius:9px; background:var(--gold-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.pop-card .qi svg{width:15px; height:15px; color:var(--gold);}
.pop-card b{font-size:12px; display:block;}
.pop-card span{font-size:10.5px; color:var(--ink-soft);}

.promo-card{background:var(--red-tint); border-radius:16px; padding:16px; display:flex; gap:12px; align-items:center;}
.promo-card svg{flex-shrink:0;}
.promo-card b{font-size:13px; display:block; margin-bottom:2px;}
.promo-card p{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}

/* ===== RESULT ROWS ===== */
.res-row{display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line);}
.res-row:last-child{border-bottom:none;}
.res-ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:700; font-family:var(--font-mono); font-size:13px;}
.res-main{flex:1; min-width:0;}
.res-main b{font-size:13.5px; display:block;}
.res-main span{font-size:11.5px; color:var(--ink-soft); display:block; margin-top:2px;}
.res-dist{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); flex-shrink:0; text-align:right;}
.res-dist b{color:var(--red); display:block; font-size:12px;}

/* ===== TABS (result / saved) ===== */
.tabbar{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px;}
.tabbar button{flex-shrink:0; background:#fff; border:1.4px solid var(--line); border-radius:10px; padding:7px 11px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
.tabbar button.on{background:var(--surface-dark); color:#fff; border-color:var(--surface-dark);}

/* ===== BUILDING OVERVIEW ===== */
.b-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
.b-head h1{font-size:20px;}
.b-head span{font-size:12px; color:var(--ink-soft);}
.b-ico{width:52px; height:52px; border-radius:14px; background:var(--gold-tint); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.b-actions{display:flex; gap:8px; margin-bottom:16px;}
.b-actions .btn{flex:1;}

.accordion{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; margin-bottom:10px;}
.acc-head{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; cursor:pointer; font-size:13.5px; font-weight:600;}
.acc-head svg{transition:transform .15s; color:var(--ink-soft); width:16px; height:16px;}
.accordion.open .acc-head svg{transform:rotate(180deg);}
/* .acc-body base + open-state rules now defined in the ANIMATIONS block below (grid-based smooth expand) */
.room-tile{
  background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:left;
}
.room-tile b{font-size:12.5px; display:block; font-family:var(--font-mono);}
.room-tile span{font-size:10.5px; color:var(--ink-soft); display:block; margin-top:2px;}
.room-tile.avail-yes{border-color:var(--green); background:var(--green-tint);}
.room-tile.avail-no{border-color:var(--red); background:var(--red-tint);}

/* ===== MAP PAGE ===== */
.layer-panel{margin-bottom:12px;}
.layer-list{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.layer-item{display:flex; align-items:center; gap:8px; font-size:12px;}
.layer-item input{accent-color:var(--red); width:15px; height:15px;}
.map-canvas{position:relative; border-radius:16px; overflow:hidden; background:var(--bg); border:1px solid var(--line);}
.map-canvas svg{display:block; width:100%; height:auto;}
.map-controls{position:absolute; right:10px; bottom:64px; display:flex; flex-direction:column; gap:6px;}
.mc-btn{width:34px; height:34px; border-radius:9px; background:#fff; border:1px solid var(--line); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:16px;}
.my-loc{position:absolute; left:10px; bottom:10px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:6px; box-shadow:var(--shadow);}
.map-pin{cursor:pointer;}
.map-pin text.lbl{font-family:var(--font-mono); font-size:8.5px; fill:var(--ink-soft);}
.map-pin.you circle.pulse{animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{r:8; opacity:.6;} 100%{r:20; opacity:0;}}
.route-line{stroke-dasharray:6 6; animation:dash 1.2s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-24;}}

.sheet{
  position:fixed; left:0; right:0; bottom:0; max-width:460px; margin:0 auto; background:#fff; border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px -6px rgba(0,0,0,0.25); padding:16px 16px 22px; z-index:120; animation:sheetup .18s ease;
}
@keyframes sheetup{from{transform:translateY(14px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-bar{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 12px;}

/* ===== ROOM DETAIL ===== */
.floorplan{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:6px;}
.fp-cell{aspect-ratio:1; border-radius:9px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);}
.fp-cell.active{background:var(--red); color:#fff; border-color:var(--red); font-weight:700;}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0;}
.detail-grid div span{font-size:10px; color:var(--ink-soft); text-transform:uppercase; font-family:var(--font-mono); letter-spacing:.04em;}
.detail-grid div b{display:block; font-size:13px; margin-top:2px;}
.facility-row{display:flex; gap:16px; margin-top:6px;}
.facility-row div{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-soft);}
.facility-row svg{width:18px; height:18px; color:var(--ink);}
.sticky-actions{display:flex; gap:8px; margin-top:16px;}
.sticky-actions .btn{flex:1;}

/* ===== DIRECTIONS ===== */
.mode-tabs{display:flex; gap:6px; margin-bottom:14px;}
.mode-tabs button{flex:1; background:#fff; border:1.4px solid var(--line); border-radius:11px; padding:9px 4px; font-size:11px; font-weight:600; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px;}
.mode-tabs button.on{background:var(--surface-dark); color:#fff; border-color:var(--surface-dark);}
.mode-tabs svg{width:16px; height:16px;}
.fromto{background:#fff; border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:14px; position:relative;}
.ft-row{display:flex; align-items:center; gap:10px; padding:10px 10px;}
.ft-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.ft-row select{border:none; outline:none; font-size:13px; background:transparent; width:100%; font-family:var(--font-body); color:var(--ink);}
.ft-divider{height:1px; background:var(--line); margin:0 10px;}
.swap-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
.stat-row{display:flex; gap:10px; margin-bottom:14px;}
.stat-box{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
.stat-box b{font-size:18px; display:block; font-family:var(--font-mono);}
.stat-box span{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.acc-toggle{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 14px;}
.acc-toggle span{font-size:12px; color:var(--ink-soft);}
.step-row{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.step-row:last-child{border-bottom:none;}
.step-num{width:24px; height:24px; border-radius:50%; background:var(--surface-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--font-mono); flex-shrink:0;}
.step-row p{font-size:12.5px; line-height:1.5;}
.step-row p b{display:block; font-size:12.5px;}
.step-row p .sd{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft);}

/* ===== DOCTORS ===== */
.doc-row{display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line);}
.doc-row:last-child{border-bottom:none;}
.doc-photo{width:42px; height:42px; border-radius:50%; background:var(--surface-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:13px; flex-shrink:0;}
.doc-main{flex:1; min-width:0;}
.doc-main b{font-size:13.5px; display:block;}
.doc-main .dept{font-size:11.5px; color:var(--red); font-weight:600;}
.doc-main .loc{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.bookmark-btn{width:32px; height:32px; border-radius:9px; border:1.4px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.bookmark-btn.on{background:var(--red); border-color:var(--red);}
.bookmark-btn.on svg{color:#fff;}
.field select, .field input{width:100%; padding:10px 12px; border-radius:10px; border:1.4px solid var(--line); font-size:13px; background:#fff; font-family:var(--font-body); color:var(--ink);}
.field{margin-bottom:12px;}
.field label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:6px; font-family:var(--font-mono);}

/* ===== VISITOR GUIDE ===== */
.vg-step{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
.vg-step:last-child{border-bottom:none;}
.vg-num{width:26px; height:26px; border-radius:50%; background:var(--red); color:#fff; font-family:var(--font-mono); font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.vg-step b{font-size:13px; display:block;}
.vg-step span{font-size:11.5px; color:var(--ink-soft);}
.help-card{background:var(--surface-dark); color:#fff; border-radius:16px; padding:16px; display:flex; gap:12px; align-items:center; margin-top:12px;}
.help-ic{width:40px; height:40px; border-radius:11px; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.help-card b{font-size:13px; display:block;}
.help-card p{font-size:11.5px; color:rgba(255,255,255,0.6); margin-top:2px;}

/* ===== SAVED ===== */
.saved-row{display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line);}
.saved-row:last-child{border-bottom:none;}
.saved-x{width:26px; height:26px; border-radius:50%; background:var(--bg); border:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0;}

/* ===== MORE MENU ===== */
.more-row{display:flex; align-items:center; gap:12px; padding:13px; border-bottom:1px solid var(--line);}
.more-row:last-child{border-bottom:none;}
.more-ic{width:34px; height:34px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.more-row b{font-size:13px; flex:1;}
.more-row svg.chev{width:15px; height:15px; color:var(--ink-soft);}

/* ===== FAQ / SETTINGS ===== */
.faq-item{border-bottom:1px solid var(--line); padding:12px 0;}
.faq-item:last-child{border-bottom:none;}
.faq-q{display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:600; cursor:pointer;}
.faq-q svg{width:15px; height:15px; transition:transform .15s; color:var(--ink-soft);}
.faq-item.open .faq-q svg{transform:rotate(45deg);}
.faq-a{font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.55; display:none;}
.faq-item.open .faq-a{display:block;}
.toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row b{font-size:13px; display:block;}
.toggle-row span{font-size:11px; color:var(--ink-soft);}
.switch{position:relative; width:40px; height:23px; background:var(--line); border-radius:999px; flex-shrink:0;}
.switch.on{background:var(--red);}
.switch .knob{position:absolute; top:3px; left:3px; width:17px; height:17px; background:#fff; border-radius:50%; transition:left .15s;}
.switch.on .knob{left:20px;}

.empty{text-align:center; padding:50px 16px; color:var(--ink-soft);}
.empty svg{margin-bottom:12px; opacity:.5;}
.empty h4{font-size:14px; color:var(--ink); margin-bottom:6px;}
.empty p{font-size:12px;}

.toast{
  position:fixed; bottom:78px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface-dark); color:#fff;
  padding:11px 18px; border-radius:10px; font-size:12.5px; opacity:0; transition:opacity .2s, transform .2s; z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.badge-toast{
  position:fixed; top:16px; left:0; right:0; margin:0 auto; max-width:420px; width:calc(100% - 32px); z-index:250;
  background:linear-gradient(135deg, var(--red), var(--red-dark)); color:#fff; border-radius:14px; padding:12px 16px;
  display:flex; align-items:center; gap:12px; box-shadow:0 14px 30px -10px rgba(200,16,46,.5); opacity:0;
  transform:translateY(-30px); transition:opacity .3s cubic-bezier(.34,1.56,.64,1), transform .3s cubic-bezier(.34,1.56,.64,1);
}
.badge-toast.show{ opacity:1; transform:translateY(0); }
.badge-toast-ic{ width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; animation:pop .5s ease .1s backwards; }
.badge-toast b{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; opacity:.85; display:block; }
.badge-toast span{ font-size:14px; font-weight:700; display:block; }

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeSlideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.page-enter{ animation:fadeSlideIn .3s cubic-bezier(.22,.9,.32,1); }
@keyframes stepIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);} }
@keyframes pinDrop{ from{opacity:0; transform:translateY(-8px) scale(.7);} to{opacity:1; transform:translateY(0) scale(1);} }
.map-pin{ animation:pinDrop .4s cubic-bezier(.34,1.56,.64,1) backwards; }
.map-pin.no-anim{ animation:none; }
@keyframes pop{ 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }
.icon-btn.on, .bookmark-btn.on{ animation:pop .35s ease; }
@keyframes pulse2{ 0%{box-shadow:0 0 0 0 rgba(30,138,76,.5);} 100%{box-shadow:0 0 0 8px rgba(30,138,76,0);} }

/* buttons & pressables */
.btn{ transition:transform .12s ease, background .15s ease, box-shadow .15s ease; }
.btn:active{ transform:scale(.96); }
.icon-btn, .bookmark-btn, .mc-btn, .swap-btn{ transition:transform .12s ease, background .15s ease; }
.icon-btn:active, .bookmark-btn:active, .mc-btn:active, .swap-btn:active{ transform:scale(.9); }
.qcard, .pop-card, .room-tile, .guide-card, .promo-card{ transition:transform .16s ease, box-shadow .16s ease; }
.qcard:active, .pop-card:active, .room-tile:active{ transform:scale(.96); }
.res-row, .doc-row, .more-row, .saved-row{ transition:background .15s ease; }
.res-row:active, .doc-row:active, .more-row:active{ background:var(--bg); }
@media(hover:hover){
  .qcard:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .pop-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .room-tile:hover{ transform:translateY(-1px); }
  .res-row:hover, .doc-row:hover, .more-row:hover{ background:var(--bg); }
}
.fchip, .tabbar button, .mode-tabs button{ transition:background .18s ease, color .18s ease, transform .12s ease; }
.fchip:active, .tabbar button:active, .mode-tabs button:active{ transform:scale(.95); }

/* bottom / top nav */
.bottombar button svg{ transition:transform .22s cubic-bezier(.34,1.56,.64,1); }
.bottombar button.on svg{ transform:translateY(-2px) scale(1.08); }
.topnav button{ transition:background .18s ease, color .18s ease; }

/* smooth accordion */
.acc-body{ max-height:0; overflow:hidden; transition:max-height .32s cubic-bezier(.4,0,.2,1); }
.accordion.open .acc-body{ max-height:1000px; }
.acc-body-inner{ padding:2px 14px 14px; }
.accordion.open .acc-head svg{ transition:transform .22s ease; }

/* golf cart request flow */
.golfcart-card{ animation:fadeSlideIn .25s ease; }
.cart-spinner{ width:44px; height:44px; border-radius:12px; background:var(--red-tint); display:flex; align-items:center; justify-content:center; animation:cartBounce 1s ease-in-out infinite; flex-shrink:0; }
@keyframes cartBounce{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }
.pulse-dots{ display:flex; gap:6px; }
.pulse-dots span{ width:7px; height:7px; border-radius:50%; background:var(--red); opacity:.3; animation:dotPulse 1.2s ease-in-out infinite; }
.pulse-dots span:nth-child(2){ animation-delay:.15s; }
.pulse-dots span:nth-child(3){ animation-delay:.3s; }
@keyframes dotPulse{ 0%,80%,100%{opacity:.25; transform:scale(.85);} 40%{opacity:1; transform:scale(1);} }
.cart-track{ position:relative; height:6px; background:var(--line); border-radius:999px; margin-top:4px; overflow:visible; }
.cart-track-fill{ position:absolute; left:0; top:0; height:100%; width:40%; background:var(--red); border-radius:999px; animation:trackFill 2.2s ease-in-out infinite alternate; }
@keyframes trackFill{ from{width:8%;} to{width:88%;} }
.cart-icon-moving{ position:absolute; top:50%; left:8%; transform:translate(-50%,-50%); width:22px; height:22px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; animation:cartMove 2.2s ease-in-out infinite alternate; box-shadow:0 2px 6px rgba(200,16,46,.4); }
@keyframes cartMove{ from{left:8%;} to{left:88%;} }

/* toast */
.toast{ transition:opacity .25s cubic-bezier(.34,1.56,.64,1), transform .25s cubic-bezier(.34,1.56,.64,1); }

/* pin sheet slide already has sheetup */
/* ===== badges page ===== */
.page-head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.lb-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.lb-row:last-child{ border-bottom:none; }
.lb-row.lb-me{ background:var(--red-tint); margin:0 -12px; padding:11px 12px; border-radius:10px; border-bottom:none; }
.lb-rank{ width:24px; height:24px; border-radius:50%; background:var(--bg); color:var(--ink-soft); font-family:var(--font-mono); font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.badge-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.badge-cell{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; position:relative; }
.badge-cell.locked{ opacity:.45; }
.badge-cell .b-ic{ width:44px; height:44px; border-radius:13px; background:var(--red-tint); display:flex; align-items:center; justify-content:center; margin:0 auto 10px; }
.badge-cell.locked .b-ic{ background:var(--bg); }
.badge-cell.unlocked{ animation:pop .35s ease; }
.badge-cell b{ font-size:12px; display:block; margin-bottom:3px; }
.badge-cell span{ font-size:10.5px; color:var(--ink-soft); line-height:1.4; display:block; }
.badge-cell .lock-ic{ position:absolute; top:8px; right:8px; opacity:.5; }
.badge-progress-bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:10px 0 4px; }
.badge-progress-fill{ height:100%; background:var(--red); border-radius:999px; transition:width .4s ease; }

/* ===== schedule ===== */
.next-class-card{ background:linear-gradient(135deg, var(--surface-dark), #2A2E33); color:#fff; border-radius:16px; padding:16px; margin-bottom:16px; transition:background .25s ease; }

@keyframes urgentPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(200,16,46,.35); } 50%{ box-shadow:0 0 0 8px rgba(200,16,46,0); } }
.next-class-card .nc-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.75; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
.next-class-card h4{ font-size:16px; margin-bottom:4px; }
.next-class-card .nc-meta{ font-size:12px; opacity:.75; margin-bottom:12px; }
.next-class-card .nc-stats{ display:flex; gap:16px; }
.next-class-card .nc-stat b{ font-family:var(--font-mono); font-size:17px; display:block; }
.next-class-card .nc-stat span{ font-size:10px; opacity:.6; text-transform:uppercase; }
.class-row{ display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line); }
.class-row:last-child{ border-bottom:none; }
.class-day-chip{ width:40px; height:40px; border-radius:11px; background:var(--red-tint); color:var(--red); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:11px; flex-shrink:0; }

/* ===== study room booking / occupancy ===== */
.occ-bar-wrap{ display:flex; align-items:center; gap:10px; margin-top:8px; }
.occ-bar{ flex:1; height:9px; border-radius:999px; background:var(--line); overflow:hidden; }
.occ-bar-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
.slot-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
.slot-btn{ padding:9px 4px; border-radius:9px; border:1.4px solid var(--line); background:#fff; font-size:11px; font-weight:600; font-family:var(--font-mono); color:var(--ink-soft); }
.slot-btn.booked-mine{ background:var(--red); border-color:var(--red); color:#fff; }
.slot-btn.booked-other{ background:var(--bg); border-color:var(--line); color:var(--ink-soft); text-decoration:line-through; }
.study-room-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }

/* ===== QR check-in overlay ===== */
.qr-overlay{ position:fixed; inset:0; background:rgba(10,12,13,.82); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeSlideIn .2s ease; }
.qr-modal{ background:var(--surface-dark); border-radius:22px; padding:28px 24px 26px; width:100%; max-width:320px; text-align:center; position:relative; }
.qr-close{ position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.1); border:none; color:#fff; font-size:16px; }
.qr-viewfinder{ position:relative; width:180px; height:180px; margin:8px auto 18px; border-radius:16px; overflow:hidden; background:#fff; }
.qr-code-art{ width:100%; height:100%; }
.qr-scanline{ position:absolute; left:6%; right:6%; height:2.5px; background:var(--red); box-shadow:0 0 10px 2px rgba(200,16,46,.7); animation:qrScan 1.6s ease-in-out infinite; }
@keyframes qrScan{ 0%{top:6%;} 50%{top:92%;} 100%{top:6%;} }
.qr-corner{ position:absolute; width:22px; height:22px; border-color:var(--red); }
.qr-corner.tl{ top:6px; left:6px; border-top:3px solid; border-left:3px solid; border-radius:6px 0 0 0; }
.qr-corner.tr{ top:6px; right:6px; border-top:3px solid; border-right:3px solid; border-radius:0 6px 0 0; }
.qr-corner.bl{ bottom:6px; left:6px; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 6px; }
.qr-corner.br{ bottom:6px; right:6px; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 6px 0; }

.qr-success-ic{ width:64px; height:64px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin:8px auto 18px; animation:pop .4s ease; }

function fmtDist(m){
  if(state.settings.metric) return `${m} m`;
  const ft = Math.round(m*3.281);
  return `${ft} ft`;
}
function distFromGate(placeId){
  const places = allPlaces();
  const gate = places.find(p=>p.id==='gate-main');
  const target = places.find(p=>p.id===placeId);
  if(!gate || !target) return 120;
  const dx=Math.abs(gate.x-target.x), dy=Math.abs(gate.y-target.y);
  return Math.max(40, Math.round(Math.sqrt(dx*dx+dy*dy)*8));
}

function allPlaces(){
  const bldgs = BUILDINGS.map(b=>{
    let cat = 'building';
    if(b.id==='library') cat='library';
    if(b.id==='b9') cat='medical';
    return {id:b.id, name:b.name.replace(/&amp;/g,'&'), category:cat, code:b.code, x:b.x, y:b.y, sub:b.dept};
  });
  const svc = SERVICES.map(s=>({id:s.id, name:s.name, category:(s.category==='atm'?'atm':(s.category==='gate'?'gate':(s.category==='parking'?'parking':(s.category==='restroom'?'restroom':'service')))), x:s.x, y:s.y, sub:s.description}));
  return [...bldgs, ...svc];
}
function findBuilding(id){ return BUILDINGS.find(b=>b.id===id); }
function findDoctor(id){ return DOCTORS.find(d=>d.id===id); }
function findService(id){ return SERVICES.find(s=>s.id===id); }
function findRoomAnywhere(roomId){
  for(const b of BUILDINGS){
    for(const fl of b.floors){
      const r = (b.roomsByFloor[fl]||[]).find(r=>r.id===roomId);
      if(r) return {room:r, building:b, floor:fl};
    }
  }
  return null;
}
function initialsOf(name){ return name.split(' ').filter(w=>w[0]===w[0].toUpperCase() && w.length>1).slice(-2).map(w=>w[0]).join(''); }

const navHistory = [];
let _suppressHistoryPush = false;
function navigate(name, params={}){
  if(!_suppressHistoryPush && state.route && state.route.name && state.route.name!==name){
    navHistory.push({name: state.route.name, params: state.route.params});
    if(navHistory.length>50) navHistory.shift();
  }
  if(name==='map' && state.route.name!=='map'){ mapPinsAnimated = false; }
  _suppressHistoryPush = false;
  state.route = {name, params};
  if(name==='building' && params.id){ state.stats.buildingsVisited.add(params.id); checkBadges(); }
  if(name==='room' && params.id){ state.stats.roomsViewed++; checkBadges(); }
  if(name==='doctor' && params.id){ state.stats.doctorsViewed++; checkBadges(); }
  render();
  const c = document.getElementById('content'); if(c) c.scrollTop = 0;
  window.scrollTo(0,0);
}
/* used by the Android WebView wrapper's hardware back button; returns true if it navigated, false if there's nowhere left to go (so the native shell can exit/minimize) */
function goBackInApp(){
  if(state.qrScan && state.qrScan.open){ cancelQrScan(); return true; }
  if(state.tourStep>=0){ state.tourStep=-1; render(); return true; }
  if(navHistory.length===0) return false;
  const prev = navHistory.pop();
  _suppressHistoryPush = true;
  navigate(prev.name, prev.params);
  return true;
}
window.goBackInApp = goBackInApp;
function login(role, profile){
  state.auth.loggedIn = true;
  state.auth.role = role;
  if(profile) state.profile = profile;
  navHistory.length = 0;
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('app-shell').classList.add('active');
  navigate('home');
  applyChrome();
  saveState();
}
function logout(){
  state.auth = {loggedIn:false, role:null};
  state.profile = {name:'Guest User', type:'Visitor', email:'guest@ejust.edu.eg'};
  navHistory.length = 0;
  document.getElementById('app-shell').classList.remove('active');
  document.getElementById('screen-login').classList.remove('hidden');
  saveState();
}

/* ============================================================
   PERSISTENCE — localStorage
   ============================================================ */
const STORAGE_KEY = 'ejust-campus-map-v1';
function saveState(){
  try{
    const snapshot = {
      auth: state.auth,
      profile: state.profile,
      saved: state.saved,
      recent: state.recent,
      schedule: state.schedule,
      bookings: state.bookings,
      occupancy: state.occupancy,
      layers: state.layers,
      settings: state.settings,
      unlockedBadges: Array.from(state.unlockedBadges),
      stats: { ...state.stats, buildingsVisited: Array.from(state.stats.buildingsVisited) },
      lastNotifiedClassKey: state.lastNotifiedClassKey
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){ /* storage unavailable (private mode, quota, etc) — app still works, just won't persist */ }
}
function saveStateDebounced(){
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(saveState, 200);
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const snap = JSON.parse(raw);
    if(snap.auth) state.auth = snap.auth;
    if(snap.profile) state.profile = snap.profile;
    if(snap.saved) state.saved = snap.saved;
    if(snap.recent) state.recent = snap.recent;
    if(snap.schedule) state.schedule = snap.schedule;
    if(snap.bookings) state.bookings = snap.bookings;
    if(snap.occupancy) state.occupancy = snap.occupancy;
    if(snap.layers) state.layers = { ...state.layers, ...snap.layers };
    if(snap.settings) state.settings = { ...state.settings, ...snap.settings };
    if(snap.unlockedBadges) state.unlockedBadges = new Set(snap.unlockedBadges);
    if(snap.stats) state.stats = { ...state.stats, ...snap.stats, buildingsVisited: new Set(snap.stats.buildingsVisited||[]) };
    if(snap.lastNotifiedClassKey) state.lastNotifiedClassKey = snap.lastNotifiedClassKey;
    return true;
  }catch(e){ return false; }
}
function resetAllData(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}
function showToast(msg, undoFn){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span>` + (undoFn ? ` <button id="toast-undo" style="background:none;border:none;color:var(--gold);font-weight:700;font-size:12.5px;margin-left:8px;">Undo</button>` : '');
  t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 3200);
  if(undoFn){ const btn = document.getElementById('toast-undo'); if(btn) btn.onclick = ()=>{ undoFn(); t.classList.remove('show'); }; }
}

/* ============================================================
   MY SCHEDULE
   ============================================================ */
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function addScheduleEntry(day, time, course, buildingId, room){
  if(!day || !time || !course || !buildingId) return false;
  state.schedule.push({id:'sch-'+Date.now()+Math.random().toString(36).slice(2,5), day, time, course, buildingId, room:room||''});
  state.stats.scheduleAdded = true;
  checkBadges();
  scheduleClassReminder();
  return true;
}
function parseScheduleText(text){
  let added = 0, failed = 0;
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length<4){ failed++; return; }
    const [day, time, course, buildingRaw, room] = parts;
    const dayNorm = WEEKDAYS.find(d=>d.toLowerCase()===day.slice(0,3).toLowerCase());
    const building = BUILDINGS.find(b=> b.code.toLowerCase()===buildingRaw.toLowerCase() || b.id.toLowerCase()===buildingRaw.toLowerCase() || b.name.toLowerCase().includes(buildingRaw.toLowerCase()));
    if(!dayNorm || !building || !/^\d{1,2}:\d{2}$/.test(time)){ failed++; return; }
    addScheduleEntry(dayNorm, time, course, building.id, room||'');
    added++;
  });
  return {added, failed};
}
function getNextClass(){
  if(!state.schedule.length) return null;
  const now = new Date();
  const nowDay = now.getDay(), nowMins = now.getHours()*60+now.getMinutes();
  let best = null, bestDelta = Infinity;
  state.schedule.forEach(cls=>{
    const clsDay = WEEKDAYS.indexOf(cls.day);
    const [h,m] = cls.time.split(':').map(Number);
    const clsMins = h*60+m;
    let dayDelta = clsDay - nowDay;
    if(dayDelta<0 || (dayDelta===0 && clsMins<=nowMins)) dayDelta += 7;
    const totalDelta = dayDelta*1440 + (clsMins-nowMins);
    if(totalDelta < bestDelta){ bestDelta = totalDelta; best = cls; }
  });
  return best ? {cls:best, minsAway:bestDelta} : null;
}

/* ============================================================
   PUSH-STYLE CLASS REMINDERS (real Notification API)
   ============================================================ */
function requestNotifPermission(){
  /* running inside the native Android wrapper — OS handles the permission prompt at app launch, notifications go through AndroidBridge instead of the web Notification API (which doesn't work on file:// origins anyway) */
  if(window.AndroidBridge && window.AndroidBridge.postNotification) return Promise.resolve('granted');
  if(!('Notification' in window)){
    showToast('This browser doesn\u2019t support notifications');
    return Promise.resolve('unsupported');
  }
  if(Notification.permission==='granted') return Promise.resolve('granted');
  if(Notification.permission==='denied'){
    showToast('Notifications are blocked in your browser settings');
    return Promise.resolve('denied');
  }
  return Notification.requestPermission().then(perm=>{
    if(perm!=='granted') showToast('Notifications weren\u2019t enabled \u2014 you\u2019ll still see in-app reminders');
    return perm;
  });
}
function scheduleClassReminder(){
  clearTimeout(window._reminderTimer);
  if(!state.settings.classReminders) return;
  const next = getNextClass();
  if(!next) return;
  const msUntilReminder = (next.minsAway-10)*60000;
  if(next.minsAway<=10){
    fireClassReminder(next);
  } else {
    window._reminderTimer = setTimeout(()=>{ fireClassReminder(next); scheduleClassReminder(); }, Math.max(1000,msUntilReminder));
  }
}
function fireClassReminder(next){
  const cls = next.cls;
  const key = cls.id+'@'+cls.day+cls.time;
  if(state.lastNotifiedClassKey===key) return;
  state.lastNotifiedClassKey = key;
  const b = findBuilding(cls.buildingId);
  const place = b ? b.name.replace(/&amp;/g,'&') + (cls.room?', Room '+cls.room:'') : '';
  const title = `${cls.course} starts in ${Math.max(0,next.minsAway)} min`;
  if(window.AndroidBridge && window.AndroidBridge.postNotification){
    try{ window.AndroidBridge.postNotification(title, place); }catch(e){}
  } else if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title, {body: place, tag:key}); }catch(e){}
  }
  showToast(`${title} \u2014 ${place}`);
  render();
}

/* Full detail render for the main Interactive Map: real building footprints
   (sized by floor count) with persistent labels, not just anonymous dots. */
let mapPinsAnimated = false;
function renderMapSvg(){
  const places = allPlaces();
  const visible = places.filter(p=> state.layers[p.category]);
  const animClass = mapPinsAnimated ? 'map-pin no-anim' : 'map-pin';
  const pins = visible.map((p,idx)=>{
    const cx=svgX(p.x), cy=svgY(p.y);
    const color = CAT_COLOR[p.category]||CAT_COLOR.building;
    const isFootprint = (p.category==='building' || p.category==='library' || p.category==='medical');
    const label = SHORT_LABEL[p.id] || p.name;
    const delay = mapPinsAnimated ? '' : `style="animation-delay:${Math.min(idx*22,300)}ms"`;
    if(isFootprint){
      const b = findBuilding(p.id);
      const floors = b ? b.floors.length : 2;
      const w = 24 + Math.min(floors,5)*3.4;
      const h = 16 + Math.min(floors,5)*2.4;
      return `<g class="${animClass}" data-pin="${p.id}" ${delay} transform="translate(${cx-w/2},${cy-h/2})">
        <rect width="${w}" height="${h}" rx="4" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="1.6"/>
        <text x="${w/2}" y="${h/2+3}" text-anchor="middle" font-size="8" fill="${color}" font-family="JetBrains Mono" font-weight="700">${(b?b.code:label).slice(0,5)}</text>
        <text x="${w/2}" y="${h+10}" text-anchor="middle" font-size="6.6" fill="#6B7076" font-family="Inter">${label}</text>
      </g>`;
    }
    return `<g class="${animClass}" data-pin="${p.id}" ${delay} transform="translate(${cx},${cy})">
      <circle r="7" fill="${color}" stroke="#fff" stroke-width="1.8"/>
      <text x="0" y="3" text-anchor="middle" font-size="7" fill="#fff" font-family="JetBrains Mono" font-weight="700">${CAT_LETTER[p.category]||'B'}</text>
      ${SHORT_LABEL[p.id] ? `<text x="0" y="17" text-anchor="middle" font-size="6.6" fill="#6B7076" font-family="Inter">${SHORT_LABEL[p.id]}</text>` : ''}
    </g>`;
  }).join('');
  let routeSvg = '';
  if(state.route.name==='navigate' && state.route.params.from && state.route.params.to){
    const fromP = places.find(p=>p.id===state.route.params.from), toP = places.find(p=>p.id===state.route.params.to);
    if(fromP && toP){
      const x1=svgX(fromP.x), y1=svgY(fromP.y), x2=svgX(toP.x), y2=svgY(toP.y), mx=(x1+x2)/2, my=(y1+y2)/2-16;

    }
  }
  mapPinsAnimated = true;
  return `<svg viewBox="0 0 ${MAP_VB_W} ${MAP_VB_H}" style="transform:scale(${state.mapZoom||1}); transform-origin:center; transition:transform .2s;">${campusBackdrop()}${routeSvg}${pins}

      <circle class="pulse" r="7" fill="#C8102E" opacity="0.45"/>
      <circle r="6" fill="#C8102E" stroke="#fff" stroke-width="2"/>
    </g></svg>`;
}

/* ============================================================
   SEARCH INDEX
   ============================================================ */
function searchIndex(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  BUILDINGS.forEach(b=>{
    const cleanName = b.name.replace(/&amp;/g,'&');
    if(cleanName.toLowerCase().includes(q) || b.code.toLowerCase().includes(q) || b.dept.toLowerCase().includes(q)){
      results.push({type:'building', id:b.id, buildingId:b.id, title:cleanName, sub:`${b.code} \u00b7 ${b.dept}`});
    }
    b.floors.forEach(fl=>{
      (b.roomsByFloor[fl]||[]).forEach(r=>{
        if(('room '+r.number).includes(q) || r.number.toLowerCase().includes(q) || r.dept.toLowerCase().includes(q) || r.type.toLowerCase().includes(q)){
          results.push({type:'room', id:r.id, buildingId:b.id, title:`${r.type} ${r.number}`, sub:`${cleanName} \u00b7 ${fl}`});
        }
      });
    });
  });
  DOCTORS.forEach(d=>{
    if(d.name.toLowerCase().includes(q) || d.dept.toLowerCase().includes(q)){
      results.push({type:'doctor', id:d.id, buildingId:d.building, title:d.name, sub:d.dept});
    }
  });
  SERVICES.forEach(s=>{
    if(s.name.toLowerCase().includes(q) || s.category.includes(q)){
      results.push({type:'service', id:s.id, buildingId:s.id, title:s.name, sub:s.category});
    }
  });
  return results;
}
function resultIcon(type){ return type==='room' ? 'room' : (type==='doctor' ? 'doctor' : (type==='service' ? 'service' : 'building')); }

  const color = pct<50 ? 'var(--green)' : (pct<85 ? 'var(--gold)' : 'var(--red)');
  return `<div class="card">
    <div class="section-title" style="margin-bottom:2px;">Live occupancy</div>
    <div style="display:flex; justify-content:space-between; align-items:baseline;">
      <span style="font-size:13px;"><b class="mono" style="font-size:16px;">${count}</b> / ${r.capacity} people here now</span>
      <span style="font-size:11px; color:var(--ink-soft);">${pct}% full</span>
    </div>

}

/* ============================================================
   PAGE: DIRECTIONS
   ============================================================ */
function renderNavigate(){
  const places = allPlaces();
  const from = state.route.params.from || 'gate-main';
  const to = state.route.params.to || '';
  const mode = state.route.params.mode || (state.settings.accessibility ? 'golfcart' : 'walk');
  const fromP = places.find(p=>p.id===from), toP = places.find(p=>p.id===to);
  let resultBlock = '';
  if(fromP && toP){
    const dx=Math.abs(fromP.x-toP.x), dy=Math.abs(fromP.y-toP.y);
    const dist = Math.max(70, Math.round(Math.sqrt(dx*dx+dy*dy)*8));

    if(mode==='golfcart'){
      const cartTime = Math.max(1, Math.round(dist/220));
      resultBlock = `
        <div class="stat-row">
          <div class="stat-box"><b>${cartTime} min</b><span>Ride time</span></div>
          <div class="stat-box"><b>${fmtDist(dist)}</b><span>Distance</span></div>
          <div class="stat-box"><b>Cart</b><span>Mode</span></div>
        </div>
        <div class="card" style="padding:6px; margin-bottom:14px; overflow:hidden;">${renderRouteMap(fromP,toP)}</div>
        ${renderGolfCartCard(fromP, toP, cartTime)}
      `;
    } else {
      const time = Math.max(2, Math.round(dist/80));
      const steps = [
        {t:`Exit ${fromP.name} toward the main path.`, d:Math.round(dist*0.3)},
        {t:`Continue straight, keeping the ${toP.category==='building'?'academic core':'landmark'} on your right.`, d:Math.round(dist*0.4)},
        {t:`Turn toward ${toP.name} at the signage.`, d:Math.round(dist*0.2)},
        {t:`Arrive at ${toP.name}.`, d:Math.round(dist*0.1)}
      ];
      resultBlock = `
        <div class="stat-row">
          <div class="stat-box"><b>${time} min</b><span>Est. time</span></div>
          <div class="stat-box"><b>${fmtDist(dist)}</b><span>Distance</span></div>
          <div class="stat-box"><b>Walk</b><span>Mode</span></div>
        </div>
        <div class="card" style="padding:6px; margin-bottom:14px; overflow:hidden;">${renderRouteMap(fromP,toP)}</div>
        <div class="card">
          <div class="section-title">Step-by-step directions</div>
          ${steps.map((s,i)=>`<div class="step-row" style="animation:stepIn .3s ease backwards; animation-delay:${i*70}ms;"><div class="step-num">${i+1}</div><p><b>${s.t}</b><span class="sd">${fmtDist(s.d)}</span></p></div>`).join('')}
          <p style="font-size:11px; color:var(--ink-soft); margin-top:10px;">Total distance: <b class="mono">${fmtDist(dist)}</b></p>
        </div>
        <button class="btn btn-dark btn-block" style="margin-top:14px;" data-action="start-nav">Start Navigation</button>
      `;
    }
  } else {
    resultBlock = `<div class="empty card">${iconFor('service',34,'#8A9099')}<h4>Choose a destination</h4><p>Pick a starting point and where you're headed.</p></div>`;
  }
  return `
  <h1 style="font-size:19px; margin-bottom:12px;" data-lbl="directionsTitle">Directions</h1>
  <div class="mode-tabs">
    <button class="${mode==='walk'?'on':''}" data-mode="walk">${iconFor('walk',15)}Walk</button>
    <button class="${mode==='golfcart'?'on':''}" data-mode="golfcart">${iconFor('golfcart',15)}Golf Cart</button>
  </div>
  <div class="fromto">
    <div class="ft-row"><span class="ft-dot" style="background:#2B2E33;"></span>
      <select id="nav-from">${places.map(p=>`<option value="${p.id}" ${p.id===from?'selected':''}>${p.name}</option>`).join('')}</select>
    </div>
    <div class="ft-divider"></div>
    <div class="ft-row"><span class="ft-dot" style="background:#C8102E;"></span>
      <select id="nav-to"><option value="">Choose a destination...</option>${places.map(p=>`<option value="${p.id}" ${p.id===to?'selected':''}>${p.name}</option>`).join('')}</select>
    </div>
    <button class="swap-btn" id="nav-swap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg></button>
  </div>
  <button class="btn btn-primary btn-block" id="nav-go" style="margin-bottom:16px;">Get Directions</button>
  ${resultBlock}
  `;
}

function renderGolfCartCard(fromP, toP, cartTime){
  const s = state.golfCartStatus;
  if(s==='searching'){
    return `<div class="card golfcart-card">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="cart-spinner">${iconFor('golfcart',22,'#C8102E')}</div>

      </div>
      <div class="pulse-dots" style="margin-top:14px;"><span></span><span></span><span></span></div>

        <span style="width:9px; height:9px; border-radius:50%; background:var(--green); animation:pulse2 1.4s ease-out infinite; flex-shrink:0;"></span>
      </div>
      <div class="cart-track"><div class="cart-track-fill"></div><div class="cart-icon-moving">${iconFor('golfcart',16,'#fff')}</div></div>

      <button class="btn btn-ghost btn-block" style="margin-top:12px;" data-action="cancel-golfcart">Cancel request</button>
    </div>`;
  }
  return `<div class="card golfcart-card">
    <div class="section-title" style="margin-bottom:4px;">Request a golf cart</div>
    <p style="font-size:12px; color:var(--ink-soft); margin-bottom:14px;">Free for students, staff and visitors. A cart usually arrives within ${cartTime+2} minutes.</p>
    <button class="btn btn-primary btn-block" data-action="request-golfcart">${iconFor('golfcart',15,'#fff')} Call Golf Cart</button>
  </div>`;
}

/* ============================================================
   MAIN DISPATCH
   ============================================================ */
function render(){
  const el = document.getElementById('content');
  const r = state.route;
  let html='';
  switch(r.name){
    case 'home': html = renderHome(); break;
    case 'search': html = renderSearch(); break;
    case 'results': html = renderResults(); break;
    case 'building': html = renderBuilding(); break;
    case 'room': html = renderRoom(); break;
    case 'map': html = renderMap(); break;
    case 'navigate': html = renderNavigate(); break;
    case 'doctors': html = renderDoctors(); break;
    case 'doctor': html = renderDoctorProfile(); break;
    case 'visitor': html = renderVisitor(); break;
    case 'saved': html = renderSaved(); break;
    case 'more': html = renderMore(); break;
    case 'recent': html = renderRecent(); break;
    case 'help': html = renderHelp(); break;
    case 'profile': html = renderProfile(); break;
    case 'settings': html = renderSettings(); break;
    case 'badges': html = renderBadges(); break;
    case 'leaderboard': html = renderLeaderboard(); break;
    case 'schedule': html = renderSchedule(); break;
    case 'studyrooms': html = renderStudyRooms(); break;
    default: html = renderHome();
  }
  el.innerHTML = html;
  el.classList.remove('page-enter');
  void el.offsetWidth;
  el.classList.add('page-enter');

  document.querySelectorAll('#bottombar button').forEach(b=>{
    const map = {home:'home', map:'map', search:['search','results'], saved:'saved', more:['more','recent','help','profile','settings','badges','leaderboard','schedule','studyrooms']};
    const target = map[b.dataset.nav];
    const active = Array.isArray(target) ? target.includes(r.name) : target===r.name;
    b.classList.toggle('on', active);
  });
  document.querySelectorAll('#topnav button').forEach(b=>{
    const map = {map:'map', doctors:['doctors','doctor'], visitor:'visitor', help:'help'};
    const target = map[b.dataset.nav];
    const active = Array.isArray(target) ? target.includes(r.name) : target===r.name;
    b.classList.toggle('on', active);
  });

  document.querySelectorAll('.tour-sheet, .qr-overlay, .pin-sheet').forEach(el=>el.remove());
  if(state.sheetPin && r.name==='map'){
    document.body.insertAdjacentHTML('beforeend', renderPinSheet(state.sheetPin));
  }
  if(state.tourStep>=0){
    document.body.insertAdjacentHTML('beforeend', renderTourOverlay());
  }
  if(state.qrScan.open){
    document.body.insertAdjacentHTML('beforeend', renderQrScanOverlay());
  }
  applyChrome();
  saveStateDebounced();
}

function applyChrome(){
  document.querySelectorAll('[data-lbl]').forEach(el=>{ el.textContent = t(el.dataset.lbl); });
  document.body.classList.toggle('dark', !!state.settings.darkMode);
  document.getElementById('app-shell').dir = state.settings.arabic ? 'rtl' : 'ltr';
  const av = document.getElementById('topbar-avatar');
  if(av) av.textContent = state.auth.role==='student' ? (initialsOf(state.profile.name)||'ST') : 'GU';
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', function(e){
  const loginTab = e.target.closest('[data-logintab]');
  if(loginTab){
    document.querySelectorAll('[data-logintab]').forEach(b=>b.classList.toggle('on', b===loginTab));
    document.getElementById('login-student-form').classList.toggle('hidden', loginTab.dataset.logintab!=='student');
    document.getElementById('login-guest-form').classList.toggle('hidden', loginTab.dataset.logintab!=='guest');
    return;
  }
  const loginSubmit = e.target.closest('#login-submit');
  if(loginSubmit){
    const username = document.getElementById('login-username').value.trim();
    const displayName = username
      ? username.replace(/[._-]+/g,' ').split(' ').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')
      : 'Student';
    login('student', {name:displayName, type:'Current student', email:(username||'student')+'@ejust.edu.eg', studentId:username||null});
    showToast(`Welcome, ${displayName.split(' ')[0]}`);
    return;
  }
  const guestSubmit = e.target.closest('#login-guest-submit');
  if(guestSubmit){
    login('guest', {name:'Guest User', type:'Visitor', email:'guest@ejust.edu.eg'});
    showToast('Browsing as guest');
    return;
  }

  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    e.preventDefault();
    const ds = navEl.dataset;
    const params = {};
    if(ds.id) params.id = ds.id;
    if(ds.to) params.to = ds.to;
    if(ds.focus) params.focus = ds.focus;
    if(ds.q) params.q = ds.q;
    let dest = ds.nav;
    if(dest==='search' && ds.q){ addRecent(ds.q); navigate('results', {q: ds.q}); return; }
    navigate(dest, params);
    return;
  }

  const mapPin = e.target.closest('.map-pin');
  if(mapPin){ state.sheetPin = mapPin.dataset.pin; render(); return; }

  const zoomctl = e.target.closest('[data-zoomctl]');
  if(zoomctl){
    state.mapZoom = zoomctl.dataset.zoomctl==='in' ? Math.min(2, (state.mapZoom||1)+0.2) : Math.max(0.7, (state.mapZoom||1)-0.2);
    render();
    return;
  }

  const layerLabel = e.target.closest('[data-layer]');
  // handled by change event for checkbox; ignore click bubbling from label text
  const saveBtn = e.target.closest('[data-action="save"]');
  if(saveBtn){ toggleSave(saveBtn.dataset.id, saveBtn.dataset.name, saveBtn.dataset.kind); return; }
  const unsaveBtn = e.target.closest('[data-action="unsave"]');
  if(unsaveBtn){
    const idx = state.saved.findIndex(s=>s.id===unsaveBtn.dataset.id);
    const removed = idx>-1 ? state.saved[idx] : null;
    state.saved = state.saved.filter(s=>s.id!==unsaveBtn.dataset.id);
    showToast('Removed from saved places', removed ? ()=>{ state.saved.push(removed); render(); } : null);
    render(); return;
  }
  const openSaved = e.target.closest('[data-action="open-saved"]');
  if(openSaved){
    const id=openSaved.dataset.id, kind=openSaved.dataset.kind;
    if(kind==='doctor') navigate('doctor',{id});
    else if(kind==='room') navigate('room',{id});
    else if(kind==='building') navigate('building',{id});
    else navigate('map',{focus:id});
    return;
  }

  const searchResult = e.target.closest('[data-searchresult]');
  if(searchResult){
    const r = JSON.parse(searchResult.dataset.searchresult);
    if(r.type==='building') navigate('building',{id:r.id});
    else if(r.type==='room') navigate('room',{id:r.id});
    else if(r.type==='doctor') navigate('doctor',{id:r.id});
    else navigate('map',{focus:r.id});
    return;
  }

  const restab = e.target.closest('[data-restab]');
  if(restab){ state.resultTab = restab.dataset.restab; render(); return; }
  const savedtab = e.target.closest('[data-savedtab]');
  if(savedtab){ state.savedTab = savedtab.dataset.savedtab; render(); return; }

  const toggleFloor = e.target.closest('[data-toggle-floor]');
  if(toggleFloor){
    const acc = toggleFloor.closest('.accordion');
    acc.classList.toggle('open');
    return;
  }
  const roomFilterBtn = e.target.closest('[data-roomfilter]');
  if(roomFilterBtn){ state.roomFilter = roomFilterBtn.dataset.roomfilter; render(); return; }

  const visitorLink = e.target.closest('[data-visitor-link]');
  if(visitorLink){
    const l = JSON.parse(visitorLink.dataset.visitorLink);
    if(l.target.type==='building') navigate('building',{id:l.target.id});
    else if(l.target.type==='service') navigate('map',{focus:l.target.id});
    else navigate('help');
    return;
  }

  const startTour = e.target.closest('[data-action="start-tour"]');
  if(startTour){ state.tourStep=0; render(); return; }
  const tourNext = e.target.closest('[data-action="tour-next"]');
  if(tourNext){ state.tourStep=Math.min(TOUR_STOPS.length-1, state.tourStep+1); render(); return; }
  const tourPrev = e.target.closest('[data-action="tour-prev"]');
  if(tourPrev){ state.tourStep=Math.max(0, state.tourStep-1); render(); return; }
  const endTour = e.target.closest('[data-action="end-tour"]');
  if(endTour){
    if(state.tourStep===TOUR_STOPS.length-1){ state.stats.tourCompleted=true; checkBadges(); }
    state.tourStep=-1; navigate('map',{focus:TOUR_STOPS[TOUR_STOPS.length-1].ref}); return;
  }

  const modeBtn = e.target.closest('[data-mode]');
  if(modeBtn){
    const mode = modeBtn.dataset.mode;
    const from = document.getElementById('nav-from') ? document.getElementById('nav-from').value : state.route.params.from;
    const to = document.getElementById('nav-to') ? document.getElementById('nav-to').value : state.route.params.to;
    state.golfCartStatus = 'idle';
    navigate('navigate', {from, to, mode});
    return;
  }
  const reqCart = e.target.closest('[data-action="request-golfcart"]');
  if(reqCart){ requestGolfCart(); return; }
  const cancelCart = e.target.closest('[data-action="cancel-golfcart"]');
  if(cancelCart){ cancelGolfCart(); return; }
  const navGo = e.target.closest('#nav-go');
  if(navGo){
    const from = document.getElementById('nav-from').value, to = document.getElementById('nav-to').value;
    if(!to){ showToast('Choose a destination first'); return; }
    navigate('navigate', {from, to, mode: state.route.params.mode || (state.settings.accessibility ? 'golfcart' : 'walk')});
    return;
  }
  const navSwap = e.target.closest('#nav-swap');
  if(navSwap){
    const from = document.getElementById('nav-from').value, to = document.getElementById('nav-to').value;
    if(to){ navigate('navigate', {from:to, to:from, mode: state.route.params.mode||'walk'}); }
    return;
  }
  const startNav = e.target.closest('[data-action="start-nav"]');
  if(startNav){ showToast('Navigation started \u2014 follow the highlighted route'); return; }

  const recentTerm = e.target.closest('[data-recent-term]');
  if(recentTerm){ navigate('results', {q: recentTerm.dataset.recentTerm}); return; }
  const removeRecent = e.target.closest('[data-action="remove-recent"]');
  if(removeRecent){ state.recent = state.recent.filter(r=>r!==removeRecent.dataset.term); render(); return; }
  const clearRecent = e.target.closest('[data-action="clear-recent"]');
  if(clearRecent){ state.recent=[]; render(); return; }

  const faq = e.target.closest('[data-faq]');
  if(faq){ faq.classList.toggle('open'); return; }

  const settingSwitch = e.target.closest('[data-setting]');
  if(settingSwitch){
    const k=settingSwitch.dataset.setting;
    state.settings[k]=!state.settings[k];
    if(k==='classReminders'){
      if(state.settings.classReminders){
        requestNotifPermission().then(()=>{ scheduleClassReminder(); render(); });
      } else {
        clearTimeout(window._reminderTimer);
        showToast('Class reminders turned off');
      }
    }
    render();
    return;
  }

  const saveProfile = e.target.closest('[data-action="save-profile"]');
  if(saveProfile){
    state.profile.name = document.getElementById('pf-name').value || 'Guest User';
    state.profile.email = document.getElementById('pf-email').value;
    state.profile.type = document.getElementById('pf-type').value;
    showToast('Profile updated'); render(); return;
  }

  const logoutBtn = e.target.closest('[data-action="logout"]');
  if(logoutBtn){ logout(); return; }

  const checkinBtn = e.target.closest('[data-action="checkin"]');
  if(checkinBtn){ toggleCheckIn(checkinBtn.dataset.id, parseInt(checkinBtn.dataset.cap,10)); return; }

  const qrCheckinBtn = e.target.closest('[data-action="qr-checkin"]');
  if(qrCheckinBtn){ openQrScan(qrCheckinBtn.dataset.id, qrCheckinBtn.dataset.cap); return; }
  const qrCancelBtn = e.target.closest('[data-action="qr-cancel"]');
  if(qrCancelBtn){ cancelQrScan(); return; }

  const bookSlotBtn = e.target.closest('[data-action="book-slot"]');
  if(bookSlotBtn && !bookSlotBtn.disabled){ toggleBookSlot(bookSlotBtn.dataset.id, bookSlotBtn.dataset.building, bookSlotBtn.dataset.slot); return; }

  const removeSchedBtn = e.target.closest('[data-action="remove-schedule"]');
  if(removeSchedBtn){ state.schedule = state.schedule.filter(c=>c.id!==removeSchedBtn.dataset.id); scheduleClassReminder(); showToast('Class removed'); render(); return; }

  const schedAddBtn = e.target.closest('#sched-add-btn');
  if(schedAddBtn){
    const day = document.getElementById('sched-day').value;
    const time = document.getElementById('sched-time').value;
    const course = document.getElementById('sched-course').value.trim();
    const buildingId = document.getElementById('sched-building').value;
    const room = document.getElementById('sched-room').value.trim();
    if(!course){ showToast('Enter a course name first'); return; }
    addScheduleEntry(day, time, course, buildingId, room);
    showToast('Class added to your schedule');
    render();
    return;
  }
  const schedParseBtn = e.target.closest('#sched-parse-btn');
  if(schedParseBtn){
    const text = document.getElementById('sched-paste').value;
    if(!text.trim()){ showToast('Paste at least one class first'); return; }
    const {added, failed} = parseScheduleText(text);
    showToast(added ? `Added ${added} class${added===1?'':'es'}${failed?`, ${failed} skipped`:''}` : 'Couldn\u2019t read those lines \u2014 check the format');
    render();
    return;
  }

  const clearAll = e.target.closest('[data-action="clear-all"]');
  if(clearAll){
    const prevSaved = state.saved.slice(), prevRecent = state.recent.slice();
    state.saved=[]; state.recent=[];
    showToast('Cleared saved places & history', ()=>{ state.saved=prevSaved; state.recent=prevRecent; render(); });
    render(); return;
  }

  const resetAllBtn = e.target.closest('[data-action="reset-all-data"]');
  if(resetAllBtn){
    if(resetAllBtn.dataset.armed==='1'){ resetAllData(); return; }
    resetAllBtn.dataset.armed = '1';
    resetAllBtn.textContent = 'Tap again to confirm reset';
    setTimeout(()=>{ if(resetAllBtn){ resetAllBtn.dataset.armed=''; resetAllBtn.textContent='Reset Prototype Data'; } }, 3000);
    return;
  }

  const clearResultsSearch = e.target.closest('[data-action="clear-results-search"]');
  if(clearResultsSearch){ navigate('search'); return; }

  if(!e.target.closest('.map-canvas') && !e.target.closest('.sheet')){
    if(state.sheetPin && !e.target.closest('[data-pin]')){ state.sheetPin=null; render(); }
  }
});

document.addEventListener('change', function(e){
  if(e.target.matches('[data-layer]')){
    state.layers[e.target.dataset.layer] = e.target.checked;
    render();
  }
  if(e.target.id==='doc-dept'){ navigate('doctors', {q: state.route.params.q, dept: e.target.value}); }
});

document.addEventListener('input', function(e){
  if(e.target.id==='search-live'){
    const val = e.target.value;
    const dd = document.getElementById('search-live-dropdown');
    if(!dd) return;
    if(val.trim()===''){ dd.classList.add('hidden'); dd.innerHTML=''; return; }
    const results = searchIndex(val).slice(0,7);
    dd.innerHTML = results.length ? results.map(r=>`
      <div class="res-row" data-searchresult='${JSON.stringify(r)}' style="cursor:pointer;">
        <div class="res-ic" style="background:${CAT_COLOR[r.type==='room'?'building':(r.type==='doctor'?'building':(r.type==='service'?'service':'building'))]}">${(r.title[0]||'?').toUpperCase()}</div>
        <div class="res-main"><b>${r.title}</b><span>${r.sub}</span></div>
      </div>`).join('') : `<div class="res-row"><div class="res-main"><b>No matches</b><span>Try a different term</span></div></div>`;
    dd.classList.remove('hidden');
  }
  if(e.target.id==='doc-filter'){
    const val = e.target.value;
    state.route.params.q = val;
    const el = document.getElementById('content');
    const dept = state.route.params.dept||'';
    render();
    setTimeout(()=>{ const inp=document.getElementById('doc-filter'); if(inp){ inp.focus(); inp.setSelectionRange(val.length,val.length);} },0);
  }
  if(e.target.id==='results-search'){
    const val = e.target.value;
    clearTimeout(window._searchDebounce);
    window._searchDebounce = setTimeout(()=>{ navigate('results', {q: val}); setTimeout(()=>{ const inp=document.getElementById('results-search'); if(inp){ inp.focus(); inp.setSelectionRange(val.length,val.length);} },0); }, 250);
  }
});

document.addEventListener('click', function(e){
  if(e.target.id==='search-go'){
    const inp = document.getElementById('search-live');
    if(inp && inp.value.trim()){ addRecent(inp.value.trim()); navigate('results', {q: inp.value.trim()}); }
    return;
  }
  if(!e.target.closest('#search-live') && !e.target.closest('#search-live-dropdown')){
    const dd = document.getElementById('search-live-dropdown');
    if(dd) dd.classList.add('hidden');
  }
});

document.addEventListener('keydown', function(e){
  if(e.target.id==='search-live' && e.key==='Enter'){
    const q = e.target.value.trim();
    if(!q) return;
    addRecent(q); navigate('results', {q});
  }
});

/* initial boot */
const restored = loadState();
if(restored && state.auth.loggedIn){
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('app-shell').classList.add('active');
  if(state.settings.classReminders) scheduleClassReminder();
  showToast(`Welcome back, ${(state.profile.name||'').split(' ')[0] || 'there'}`);
}
render();

</script>
</body>
</html>
